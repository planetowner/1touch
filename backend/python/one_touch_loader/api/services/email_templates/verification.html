<!doctype html>
<html lang="$language">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>$title</title>
  <style>
    /* 웹폰트를 지원하는 메일 앱에서는 Figma의 글꼴과 굵기를 그대로 사용해요. */
    @font-face {
      font-family: Pretendard;
      font-style: normal;
      font-weight: 500;
      src: url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/packages/pretendard/dist/web/static/woff2/Pretendard-Medium.woff2') format('woff2');
    }
    @font-face {
      font-family: Pretendard;
      font-style: normal;
      font-weight: 600;
      src: url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/packages/pretendard/dist/web/static/woff2/Pretendard-SemiBold.woff2') format('woff2');
    }
    @font-face {
      font-family: Pretendard;
      font-style: normal;
      font-weight: 700;
      src: url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/packages/pretendard/dist/web/static/woff2/Pretendard-Bold.woff2') format('woff2');
    }
    @font-face {
      font-family: Pretendard;
      font-style: normal;
      font-weight: 900;
      src: url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/packages/pretendard/dist/web/static/woff2/Pretendard-Black.woff2') format('woff2');
    }
    @media screen and (max-width: 480px) {
      .verification-instructions { padding-top: 19px !important; padding-bottom: 152px !important; font-size: 10px !important; line-height: 12px !important; }
    }
  </style>
</head>
<body style="margin: 0; padding: 0; background-color: #f5f5f5; color: #000000;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="border-collapse: collapse;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#ebebeb" style="width: 100%; max-width: 600px; border-collapse: collapse; background-color: #ebebeb; font-family: Pretendard, Arial, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; letter-spacing: 0; text-align: center;">
          <tr>
            <!-- Figma의 로고 벡터를 원래 배치대로 PNG로 묶어 메일에 함께 넣어요. -->
            <td height="117" align="center" bgcolor="#000000" style="height: 117px; background-color: #000000;">
              <img src="cid:verification-logo" alt="1touch" width="204" height="29" style="display: block; width: 204px; height: 29px; border: 0; color: #ffffff;">
            </td>
          </tr>
          <tr>
            <td style="padding: 40px 16px 18px;">
              <h1 style="margin: 0; font-size: 20px; line-height: 24px; font-weight: 900;">$code_label</h1>
            </td>
          </tr>
          <tr>
            <td height="32" style="height: 32px; padding: 0; font-size: 0; line-height: 0;">
              <div class="verification-code" style="height: 32px; font-size: 0; line-height: 0; white-space: nowrap;">$code_digits</div>
            </td>
          </tr>
          <tr>
            <!-- 본문 아래 여백은 데스크톱 204px, 모바일 152px로 푸터 위치를 맞춰요. -->
            <td class="verification-instructions" style="padding: 18px 0 204px; font-size: 14px; line-height: 17px; font-weight: 600; overflow-wrap: break-word; word-break: normal;">
              <!-- Gmail은 음수 여백을 제거해요. 본문은 최대 373px로 두고 좁은 화면에서는 메일 너비에 맞춰요. -->
              <div style="width: 100%; max-width: 373px; margin: 0 auto;">
                <p style="margin: 0;">$instructions</p>
                <p style="margin: 5px 0 0;">$ignore</p>
              </div>
            </td>
          </tr>
          <tr>
            <!-- 공개한 약관과 문의 주소를 연결하고, 스토어 배지는 출시 주소가 확정되면 연결해요. -->
            <td bgcolor="#0a0a0a" style="padding: 27px 12px 16px; background-color: #0a0a0a; color: #ffffff;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="border-collapse: collapse;">
                <tr>
                  <td align="center" style="padding: 0 0 8px 12px; font-size: 13px; line-height: 16px; font-weight: 500;">Download the 1Touch app</td>
                </tr>
                <tr>
                  <td align="center" style="padding-left: 12px;">
                    <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse: collapse;">
                      <tr>
                        <td><img src="cid:verification-google-play" alt="Get it on Google Play" width="98" height="29" style="display: block; width: 97.60339px; height: 28.94690px; border: 0;"></td>
                        <td width="10" style="width: 10px;"></td>
                        <td><img src="cid:verification-app-store" alt="Download on the App Store" width="87" height="29" style="display: block; width: 87px; height: 29px; border: 0;"></td>
                      </tr>
                    </table>
                  </td>
                </tr>
                <tr>
                  <td align="right" style="padding-top: 36px;">
                    <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse: collapse; color: #dddada; font-size: 9px; line-height: 11px; font-weight: 500;">
                      <tr>
                        <td width="57" style="width: 57px; padding-right: 27px; white-space: nowrap;"><a href="https://1touch.football/legal/privacy.html" style="color: #dddada; text-decoration: none;">Privacy Policy</a></td>
                        <td width="69" style="width: 69px; padding-right: 27px; white-space: nowrap;"><a href="https://1touch.football/legal/terms.html" style="color: #dddada; text-decoration: none;">Terms of Service</a></td>
                        <td width="45" style="width: 45px; white-space: nowrap;"><a href="mailto:support@1touch.football" style="color: #dddada; text-decoration: none;">Contact us</a></td>
                      </tr>
                    </table>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
