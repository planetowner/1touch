<!doctype html>
<html lang="$language">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>$title</title>
  <style>
    @media screen and (max-width: 480px) {
      .verification-code { height: 46.49296px !important; border-radius: 4.41195px / 6.20423px !important; }
      .verification-digit { width: 13.05756px !important; height: 32.52112px !important; margin: 0 2.3741px !important; font-size: 18px !important; line-height: 45.50704px !important; }
    }
  </style>
</head>
<body style="margin: 0; padding: 0; background-color: #f5f5f5; color: #000000;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="border-collapse: collapse;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width: 100%; max-width: 600px; border-collapse: collapse; font-family: Pretendard, Arial, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; text-align: center;">
          <tr>
            <!-- Figma의 로고 벡터를 원래 배치대로 PNG로 묶어 메일에 함께 넣어요. -->
            <td height="117" align="center" bgcolor="#000000" style="height: 117px; background-color: #000000;">
              <img src="cid:verification-logo" alt="1touch" width="204" height="29" style="display: block; width: 204px; height: 29px; border: 0; color: #ffffff;">
            </td>
          </tr>
          <tr>
            <td style="padding: 40px 16px 28px;">
              <h1 style="margin: 0; font-size: 25px; line-height: 30px; font-weight: 700;">$title</h1>
            </td>
          </tr>
          <tr>
            <td style="padding: 0 16px 18px;">
              <p style="margin: 0; font-size: 20px; line-height: 24px; font-weight: 700;">$code_label</p>
            </td>
          </tr>
          <tr>
            <td height="59" valign="middle" style="height: 59px; padding: 0 69px; font-size: 0; line-height: 0;">
              <!-- Figma의 가운데 정렬된 선은 도형 바깥으로도 뻗어요. 선 두께의 절반만큼 여백을 보정해요. -->
              <div class="verification-code" style="box-sizing: border-box; height: 61.49296px; margin: -1.24648px; border: 2.49296px solid #9e9e9e; border-radius: 7.89437px; background-color: #e6e6e6; font-size: 0; line-height: 0; white-space: nowrap;">$code_digits</div>
            </td>
          </tr>
          <tr>
            <!-- 모바일에서는 고정 너비 대신 줄바꿈으로 안내 문구가 잘리지 않게 해요. -->
            <td style="padding: 18px 6px 152px; font-size: 14px; line-height: 17px; overflow-wrap: break-word; word-break: normal;">
              <p style="margin: 0;">$instructions</p>
              <p style="margin: 0;">$ignore</p>
            </td>
          </tr>
          <tr>
            <!-- 스토어·약관·문의 주소가 확정되면 링크를 연결해요. 지금은 디자인만 표시해요. -->
            <td bgcolor="#0a0a0a" style="padding: 27px 12px 16px; background-color: #0a0a0a; color: #ffffff;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="border-collapse: collapse;">
                <tr>
                  <td align="center" style="padding: 0 0 8px 12px; font-size: 13px; line-height: 16px; font-weight: 500;">Download the 1Touch app</td>
                </tr>
                <tr>
                  <td align="center" style="padding-left: 12px;">
                    <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse: collapse;">
                      <tr>
                        <td><img src="cid:verification-google-play" alt="Get it on Google Play" width="98" height="29" style="display: block; width: 97.60339px; height: 28.94690px; border: 0;"></td>
                        <td width="10" style="width: 10px;"></td>
                        <td><img src="cid:verification-app-store" alt="Download on the App Store" width="87" height="29" style="display: block; width: 87px; height: 29px; border: 0;"></td>
                      </tr>
                    </table>
                  </td>
                </tr>
                <tr>
                  <td align="right" style="padding-top: 36px;">
                    <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse: collapse; color: #dddada; font-size: 9px; line-height: 11px; font-weight: 500;">
                      <tr>
                        <td width="57" style="width: 57px; padding-right: 27px; white-space: nowrap;">Privacy Policy</td>
                        <td width="69" style="width: 69px; padding-right: 27px; white-space: nowrap;">Terms of Service</td>
                        <td width="45" style="width: 45px; white-space: nowrap;">Contact us</td>
                      </tr>
                    </table>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
