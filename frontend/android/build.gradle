allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"

subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"

    // flutter_line_sdk 2.7.2 assumes AGP 9 always uses built-in Kotlin.
    // This project temporarily opts out of built-in Kotlin, so the plugin's
    // Kotlin sources otherwise never get compiled.
    if (project.name == "flutter_line_sdk") {
        project.pluginManager.apply("org.jetbrains.kotlin.android")
        project.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
            kotlinOptions.jvmTarget = "1.8"
        }
        project.pluginManager.withPlugin("com.android.library") {
            project.androidComponents.finalizeDsl { android ->
                android.compileSdk = 36
            }
        }
    }
}

subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
